version: "3.5"
services:
    clip:
        container_name: index-clip
        build:
            context: clip-embedding
            dockerfile: Dockerfile
        env_file:
            - .env
        ports:
            - "${CLIP_PORT}:${CLIP_PORT}"
        command:
            [
                "uvicorn",
                "main:app",
                "--reload",
                "--port",
                "${CLIP_PORT}",
                "--host",
                "0.0.0.0",
            ]
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          device_ids: ["0"]
                          capabilities: [gpu]

volumes:
    certs:
    data:
